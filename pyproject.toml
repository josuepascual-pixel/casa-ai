[project]
name = "casa-ai"
version = "0.1.3"
description = "Sistema de agentes IA conversacionales para control de energia solar, domotica KNX/ONNA, audio BluOS, camaras y red UniFi"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0",
    "python-telegram-bot>=21.6",
    "pymodbus>=3.7.0",
    "xknx>=3.2.0",
    "aiomqtt>=2.3.0",
    "xmltodict>=0.14.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
# Transcripcion local de notas de voz. Va aparte porque es, de largo, la
# dependencia mas pesada del proyecto (ctranslate2 mas los modelos) y solo
# hace falta si vas a mandar notas de voz. En una Raspberry Pi la diferencia
# entre instalarla o no es notable.
voz = [
    "faster-whisper>=1.0.3",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[project.scripts]
casa-ai = "casa_ai.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casa_ai"]
# El ejemplo de inventario viaja dentro del paquete para que el complemento de
# Home Assistant pueda dejarlo en /config la primera vez, sin tener el repo.
[tool.hatch.build.targets.wheel.force-include]
"config/config.example.yaml" = "casa_ai/config.example.yaml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
