# Inventario de una casa real (nombres de ejemplo). Copiar a config.yaml del complemento e ir
# descomentando cada seccion a medida que su sistema entra (ver
# docs/PUESTA_EN_MARCHA.md). Aqui NO van tokens ni contrasenas.

asistente:
  nombre: Jarvis
  tratamiento: usted

# Los chat_id salen en el Registro del complemento la primera vez que cada
# uno escribe al bot. Leo no tiene Telegram: habla por el satelite de su
# cuarto, y su device_id sale en Home Assistant cuando se instale.
personas:
  - nombre: Josue
    nivel: dueno
    telegram: ["PON_AQUI_TU_CHAT_ID"]
  - nombre: Ana
    nivel: adulto
    telegram: ["PON_AQUI_EL_CHAT_ID_DE_ANA"]
    # privadas: ["input_number.peso_ana"]   # la bascula, solo para ella
  - nombre: Leo
    nivel: nino
    dispositivos: []          # el device_id del satelite de su cuarto

# Por los puntos de acceso y switches que hay en UniFi.
zonas:
  - salon
  - comedor
  - cocina
  - despacho
  - suite
  - bano suite
  - vestidor
  - dormitorio leo
  - sala de juegos
  - cine
  - gym
  - lavadero
  - pasillo
  - barbacoa
  - exterior
  - piscina

# Las tres G6 Instant. El id_protect lo da `python -m casa_ai.verificar`.
camaras:
  - nombre: Cine
    zona: cine
  - nombre: Leo
    zona: dormitorio leo
  - nombre: Sala de juegos
    zona: sala de juegos

# Los reproductores los encuentra `python -m casa_ai.descubrir` y escribe
# este bloque con sus IP. Por los nombres cableados de UniFi, cabe esperar
# uno en salon, comedor, cine, suite, gym y exterior.
bluos: []

# Altavoces por los que Jarvis habla (voz_hablar y el informe de las 8).
# Los entity_id salen tras la integracion Apple TV de Home Assistant.
# Tarjetas del panel, una por sistema. Luces, persianas y toldos, accesos
# (garaje, porton, cerradura Nuki), clima y quien esta en casa salen solos.
# Cada tarjeta se descomenta cuando su integracion este instalada en Home
# Assistant y se sustituyen los entity_id por los reales.
panel: []
  # - titulo: Coche (Wallbox)
  #   entidades:
  #     Cargando: sensor.wallbox_charging_power
  #     Estado: sensor.wallbox_status_description
  #     Energia de hoy: sensor.wallbox_added_energy
  # - titulo: Agua (EcoWater)
  #   entidades:
  #     Sal: sensor.ecowater_salt_level_percent
  #     Dias de sal: sensor.ecowater_out_of_salt_days
  #     Consumo hoy: sensor.ecowater_water_usage_today
  # - titulo: Spa
  #   entidades:
  #     Temperatura: climate.spa
  #     Bomba: switch.spa_pump
  # - titulo: Riego (Solem)
  #   entidades:
  #     Programa: switch.solem_programa
  # - titulo: Cine
  #   entidades:
  #     Apple TV: media_player.apple_tv_cine
  #     Anthem: media_player.anthem
  # - titulo: Lavadero (LG)
  #   entidades:
  #     Lavadora: sensor.lavadora_estado
  #     Secadora: sensor.secadora_estado
  # - titulo: Videoportero (2N)
  #   entidades:
  #     Puerta: lock.videoportero

alias_entidades: {}
  # cocina: media_player.homepod_cocina
  # despacho: media_player.homepod_despacho
  # sala de juegos: media_player.homepod_sala_de_juegos
  # cuarto de leo: media_player.homepod_dormitorio_eros
  # bano suite: media_player.homepod_bano_suite
  # salon: media_player.salon
  # gym: media_player.gym

# Aparatos con nombre, consumo y sentido. Descomentar cada uno cuando su
# integracion este instalada y sustituir el entity_id por el real (se busca
# con "Jarvis, busca la entidad del cargador del coche").
dispositivos: []
  # - nombre: cargador del coche
  #   categoria: coche
  #   entidad: switch.wallbox_pause_resume
  #   consumo_w: 7400
  #   excedente: true
  #   notas: cargar con excedente entre semana; los fines de semana da igual
  # - nombre: spa
  #   categoria: spa
  #   entidad: climate.spa
  #   consumo_w: 3000
  #   excedente: true
  # - nombre: bomba de la piscina
  #   categoria: piscina
  #   entidad: switch.bomba_piscina
  #   consumo_w: 1100
  #   excedente: true
  #   notas: no antes de las 11
  # - nombre: lavadora
  #   categoria: electrodomestico
  #   entidad: sensor.lavadora_estado
  #   consumo_w: 2000
  # - nombre: descalcificadora
  #   categoria: agua
  #   entidad: sensor.ecowater_dias_de_sal
  #   notas: solo lectura; avisar cuando queden menos de 10 dias de sal

scripts_permitidos: []

# Al final, con el complemento en marcha y el sondeo hecho:
# planta:
#   inversor: {unit: 1}
#   contador: {unit: 3}
#   bateria: {unit: 2}

notas_casa: |
  Casa unifamiliar con planta fotovoltaica de 51 kWp y bateria de 229 kWh.
  Familia: Josue, Ana y Leo (8 anos). La camara del cuarto de Leo solo
  la ven los adultos.
