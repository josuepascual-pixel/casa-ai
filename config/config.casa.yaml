# Inventario de una casa real (nombres de ejemplo). Copiar a config.yaml del complemento e ir
# descomentando cada seccion a medida que su sistema entra (ver
# docs/PUESTA_EN_MARCHA.md). Aqui NO van tokens ni contrasenas.

asistente:
  nombre: Jarvis
  tratamiento: usted

# Los chat_id salen en el Registro del complemento la primera vez que cada
# uno escribe al bot. Leo no tiene Telegram: habla por el satelite de su
# cuarto, y su device_id sale en Home Assistant cuando se instale.
personas:
  - nombre: Josue
    nivel: dueno
    telegram: ["PON_AQUI_TU_CHAT_ID"]
  - nombre: Ana
    nivel: adulto
    telegram: ["PON_AQUI_EL_CHAT_ID_DE_ANA"]
    # privadas: ["input_number.peso_ana"]   # la bascula, solo para ella
  - nombre: Leo
    nivel: nino
    dispositivos: []          # el device_id del satelite de su cuarto

# Por los puntos de acceso y switches que hay en UniFi.
zonas:
  - salon
  - bodega
  - cocina
  - despensa
  - recibidor
  - aseo
  - despacho
  - suite
  - bano suite
  - vestidor
  - dormitorio leo
  - bano leo
  - dormitorio 2
  - dormitorio 3
  - bano invitados
  - pasillo alta
  - sala de juegos
  - cine
  - gym
  - lavadero
  - pasillo
  - habitacion servicio
  - sala de maquinas
  - barbacoa
  - exterior
  - piscina
  - jacuzzi

# Las tres G6 Instant. El id_protect lo da `python -m casa_ai.verificar`.
camaras:
  - nombre: Cine
    zona: cine
  - nombre: Leo
    zona: dormitorio leo
  - nombre: Sala de juegos
    zona: sala de juegos

# Los reproductores los encuentra `python -m casa_ai.descubrir` y escribe
# este bloque con sus IP. Por los nombres cableados de UniFi, cabe esperar
# uno en salon, cocina, cine, suite, gym y exterior.
bluos: []

# Altavoces por los que Jarvis habla (voz_hablar y el informe de las 8).
# Los entity_id salen tras la integracion Apple TV de Home Assistant.
# El plano que dibuja el panel, en celdas (una celda ~ 2 m). Es un esquema
# para empezar: mueve y cambia de tamano cada estancia hasta que se parezca
# a la casa. `alias` son otras palabras con las que HA nombra esa zona
# (p. ej. el cuarto del nino lleva su nombre en el KNX); `entidades`
# fuerza entidades concretas a una estancia.
plano:
  # Sotano, segun ONNA: sala de juegos, despacho, sala cine, habitacion de
  # servicio (con su bano), lavadero, y la sala de maquinas.
  - {zona: sala de juegos,       planta: Sotano, x: 0,  y: 0, ancho: 5, alto: 3, alias: [juegos, futbolin]}
  - {zona: despacho,             planta: Sotano, x: 5,  y: 0, ancho: 4, alto: 3, alias: [reuniones]}
  - {zona: cine,                 planta: Sotano, x: 9,  y: 0, ancho: 4, alto: 3, alias: [sala cine, estrellado]}
  - {zona: pasillo,              planta: Sotano, x: 0,  y: 3, ancho: 13, alto: 1}
  - {zona: habitacion servicio,  planta: Sotano, x: 0,  y: 4, ancho: 5, alto: 2, alias: [servicio, aseo]}
  - {zona: lavadero,             planta: Sotano, x: 5,  y: 4, ancho: 4, alto: 2}
  - {zona: sala de maquinas,     planta: Sotano, x: 9,  y: 4, ancho: 4, alto: 2, alias: [maquinas, enfriadora, deposito, climatizacion]}
  # Planta baja, segun ONNA: cocina (con despensa), bodega, salon (con las
  # ventanas del porche y de la rampa) y gimnasio. Las puertas exteriores
  # (entrada, corredera...) van a la entrada.
  - {zona: cocina,               planta: Planta baja, x: 0,  y: 0, ancho: 3, alto: 3}
  - {zona: despensa,             planta: Planta baja, x: 0,  y: 3, ancho: 3, alto: 1}
  - {zona: bodega,               planta: Planta baja, x: 3,  y: 0, ancho: 3, alto: 3, alias: [desescarche]}
  - {zona: salon,                planta: Planta baja, x: 6,  y: 0, ancho: 5, alto: 4, alias: [porche, rampa]}
  - {zona: gym,                  planta: Planta baja, x: 3,  y: 3, ancho: 3, alto: 3, alias: [gimnasio]}
  - {zona: recibidor,            planta: Planta baja, x: 0,  y: 4, ancho: 2, alto: 2, alias: [entrada, escalera, ascensor, puerta exterior, corredera]}
  - {zona: aseo,                 planta: Planta baja, x: 2,  y: 4, ancho: 1, alto: 2}
  # Planta alta, segun ONNA: suite, bano suite, vestidor, el cuarto del nino
  # y su bano, dormitorios 2 y 3, bano de invitados. En tu copia local anade
  # el nombre real del nino como alias de su cuarto y de su bano (ONNA los
  # nombra asi), p. ej. `alias: [<nombre>]` / `alias: [bano <nombre>]`.
  - {zona: suite,                planta: Planta alta, x: 0,  y: 0, ancho: 4, alto: 3, alias: [principal]}
  - {zona: bano suite,           planta: Planta alta, x: 4,  y: 0, ancho: 3, alto: 3}
  - {zona: vestidor,             planta: Planta alta, x: 7,  y: 0, ancho: 2, alto: 3}
  - {zona: dormitorio 3,         planta: Planta alta, x: 9,  y: 0, ancho: 3, alto: 3}
  - {zona: pasillo alta,         planta: Planta alta, x: 0,  y: 3, ancho: 12, alto: 1, alias: [distribuidor]}
  - {zona: dormitorio leo,       planta: Planta alta, x: 0,  y: 4, ancho: 3, alto: 2, alias: [leo]}
  - {zona: bano leo,             planta: Planta alta, x: 3,  y: 4, ancho: 2, alto: 2, alias: [bano leo]}
  - {zona: dormitorio 2,         planta: Planta alta, x: 5,  y: 4, ancho: 3, alto: 2}
  - {zona: bano invitados,       planta: Planta alta, x: 8,  y: 4, ancho: 2, alto: 2, alias: [invitados]}
  # Exterior, segun ONNA: piscina, jacuzzi, barbacoa, iluminacion, estacion meteorologica.
  - {zona: barbacoa,             planta: Exterior, x: 0,  y: 0, ancho: 4, alto: 3, exterior: true}
  - {zona: piscina,              planta: Exterior, x: 4,  y: 0, ancho: 5, alto: 3, exterior: true}
  - {zona: jacuzzi,              planta: Exterior, x: 9,  y: 0, ancho: 2, alto: 3, exterior: true, alias: [spa]}
  - {zona: exterior,             planta: Exterior, x: 0,  y: 3, ancho: 11, alto: 2, exterior: true, alias: [jardin, terraza, navidenas, meteo, fuente, mastiles, jardinera]}

# Tarjetas del panel, una por sistema. Luces, persianas y toldos, accesos
# (garaje, porton, cerradura Nuki), clima y quien esta en casa salen solos.
# Cada tarjeta se descomenta cuando su integracion este instalada en Home
# Assistant y se sustituyen los entity_id por los reales.
panel: []
  # Lo que ONNA ensena en el exterior (los entity_id salen de la integracion
  # knx de Home Assistant; buscarlos con «Jarvis, busca la entidad ...»):
  # - titulo: Tiempo (estacion meteorologica)
  #   entidades:
  #     Tiempo: sensor.knx_meteo_tiempo
  #     Temperatura: sensor.knx_meteo_temperatura
  #     Humedad: sensor.knx_meteo_humedad
  #     Viento: sensor.knx_meteo_viento
  #     Direccion: sensor.knx_meteo_direccion
  #     Presion: sensor.knx_meteo_presion
  #     Luminosidad: sensor.knx_meteo_luminosidad
  # - titulo: Jacuzzi
  #   entidades:
  #     Agua: climate.knx_jacuzzi
  #     Calentador: switch.knx_jacuzzi_calentador
  #     Filtracion: switch.knx_jacuzzi_filtracion
  #     Cubrimiento: cover.knx_jacuzzi_cubrimiento
  #     pH: sensor.knx_jacuzzi_ph
  #     ORP: sensor.knx_jacuzzi_orp
  # - titulo: Coche (Wallbox)
  #   entidades:
  #     Cargando: sensor.wallbox_charging_power
  #     Estado: sensor.wallbox_status_description
  #     Energia de hoy: sensor.wallbox_added_energy
  # - titulo: Agua (EcoWater)
  #   entidades:
  #     Sal: sensor.ecowater_salt_level_percent
  #     Dias de sal: sensor.ecowater_out_of_salt_days
  #     Consumo hoy: sensor.ecowater_water_usage_today
  # - titulo: Spa
  #   entidades:
  #     Temperatura: climate.spa
  #     Bomba: switch.spa_pump
  # - titulo: Riego (Solem)
  #   entidades:
  #     Programa: switch.solem_programa
  # - titulo: Cine
  #   entidades:
  #     Apple TV: media_player.apple_tv_cine
  #     Anthem: media_player.anthem
  # - titulo: Lavadero (LG)
  #   entidades:
  #     Lavadora: sensor.lavadora_estado
  #     Secadora: sensor.secadora_estado
  # - titulo: Videoportero (2N)
  #   entidades:
  #     Puerta: lock.videoportero

alias_entidades: {}
  # cocina: media_player.homepod_cocina
  # despacho: media_player.homepod_despacho
  # sala de juegos: media_player.homepod_sala_de_juegos
  # cuarto de leo: media_player.homepod_dormitorio_leo
  # bano suite: media_player.homepod_bano_suite
  # salon: media_player.salon
  # gym: media_player.gym

# Aparatos con nombre, consumo y sentido. Descomentar cada uno cuando su
# integracion este instalada y sustituir el entity_id por el real (se busca
# con "Jarvis, busca la entidad del cargador del coche").
dispositivos: []
  # - nombre: cargador del coche
  #   categoria: coche
  #   entidad: switch.wallbox_pause_resume
  #   consumo_w: 7400
  #   excedente: true
  #   notas: cargar con excedente entre semana; los fines de semana da igual
  # - nombre: spa
  #   categoria: spa
  #   entidad: climate.spa
  #   consumo_w: 3000
  #   excedente: true
  # - nombre: bomba de la piscina
  #   categoria: piscina
  #   entidad: switch.bomba_piscina
  #   consumo_w: 1100
  #   excedente: true
  #   notas: no antes de las 11
  # - nombre: lavadora
  #   categoria: electrodomestico
  #   entidad: sensor.lavadora_estado
  #   consumo_w: 2000
  # - nombre: descalcificadora
  #   categoria: agua
  #   entidad: sensor.ecowater_dias_de_sal
  #   notas: solo lectura; avisar cuando queden menos de 10 dias de sal

scripts_permitidos: []

# Al final, con el complemento en marcha y el sondeo hecho:
# planta:
#   inversor: {unit: 1}
#   contador: {unit: 3}
#   bateria: {unit: 2}

notas_casa: |
  Casa unifamiliar con planta fotovoltaica de 51 kWp y bateria de 229 kWh.
  Familia: Josue, Ana y Leo (8 anos). La camara del cuarto de Leo solo
  la ven los adultos.
